<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Live Avatar</title>
    <style>
      body {
        background: #f6f7fb;
        color: #121826;
        margin: 0;
        font-family: system-ui, sans-serif;
      }

      .operator-shell {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(18rem, 28rem) minmax(20rem, 1fr);
        max-width: 72rem;
        padding: 2rem;
      }

      .operator-shell h1,
      .error-banner {
        grid-column: 1 / -1;
      }

      .avatar-panel,
      .config-panel,
      .status-panel,
      .controls,
      .tools-panel,
      .transcripts {
        background: #fff;
        border: 1px solid #d9dee8;
        border-radius: 0.75rem;
        box-shadow: 0 0.25rem 1rem rgb(18 24 38 / 8%);
        padding: 1rem;
      }

      .avatar-panel {
        padding: 0;
        overflow: hidden;
      }

      .operator-shell #avatar {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .status-panel,
      .controls,
      .safe-questions,
      .transcripts {
        display: grid;
        gap: 0.5rem;
      }

      .status-line,
      .transcript-line,
      .config-panel p {
        margin: 0;
      }

      .transcripts {
        grid-column: 1 / -1;
        max-height: 18rem;
        overflow: auto;
      }

      .transcript-line.live {
        opacity: 0.72;
        font-style: italic;
      }

      button {
        border: 0;
        border-radius: 0.5rem;
        background: #2454d6;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.75rem 1rem;
      }

      button:disabled {
        background: #9aa4b5;
        cursor: not-allowed;
      }

      button.active {
        background: #b42318;
      }

      .error-banner,
      .display-status.error {
        background: #fef3f2;
        border: 1px solid #fecdca;
        color: #b42318;
        padding: 0.75rem 1rem;
      }

      .nonfatal-notice {
        grid-column: 1 / -1;
        background: #fffaeb;
        border: 1px solid #fedf89;
        color: #b54708;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
      }

      body.display-view {
        background: #000;
      }

      body.display-view #avatar {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }

      .display-status {
        position: fixed;
        left: 1rem;
        top: 1rem;
        max-width: min(32rem, calc(100vw - 2rem));
        border-radius: 0.5rem;
        background: rgb(0 0 0 / 70%);
        color: #fff;
        padding: 0.75rem 1rem;
      }

      @media (max-width: 760px) {
        .operator-shell {
          grid-template-columns: 1fr;
          padding: 1rem;
        }

        .transcripts {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
